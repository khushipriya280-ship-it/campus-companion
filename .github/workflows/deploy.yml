name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Bun 🚀
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies 📦
        run: bun install --frozen-lockfile

      - name: Build 🔧
        run: bun run build

      - name: Prepare deployment folder 📁
        run: |
          # TanStack Start (without Nitro) outputs client assets to dist/client/
          DEPLOY_DIR="dist/client"

          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "Could not find build output folder: $DEPLOY_DIR"
            exit 1
          fi

          # Find the hashed main JS entry and CSS file
          MAIN_JS=$(basename $(ls $DEPLOY_DIR/assets/index-*.js))
          MAIN_CSS=$(basename $(ls $DEPLOY_DIR/assets/styles-*.css))

          echo "Main JS: $MAIN_JS"
          echo "Main CSS: $MAIN_CSS"

          # Generate index.html — TanStack Start expects the server to render this,
          # but since GitHub Pages is static, we provide a minimal SPA shell that
          # lets the client-side router take over.
          cat > "$DEPLOY_DIR/index.html" << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Campus Buddy — Your Complete Student Life Manager</title>
              <meta name="description" content="Campus Buddy is the all-in-one student productivity app for assignments, attendance, exams, projects, internships and career prep." />
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" />
              <script>
                window.$_TSR = window.$_TSR || {
                  h: function() { this.hydrated = true; if (this.c) this.c(); },
                  e: function() { this.streamEnded = true; if (this.c) this.c(); },
                  c: function() { if (this.hydrated && this.streamEnded) delete window.$_TSR; },
                  p: function(s) { !this.initialized ? this.buffer.push(s) : s(); },
                  buffer: [],
                  initialized: false,
                  router: { matches: [], manifest: {}, dehydratedData: {} }
                };
              </script>
              <link rel="stylesheet" href="/assets/${MAIN_CSS}" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" async src="/assets/${MAIN_JS}"></script>
            </body>
          </html>
          HTMLEOF

          # Copy index.html as 404.html for SPA client-side routing fallback
          cp "$DEPLOY_DIR/index.html" "$DEPLOY_DIR/404.html"

          echo "DEPLOY_DIR=$DEPLOY_DIR" >> $GITHUB_ENV

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ env.DEPLOY_DIR }}
          branch: gh-pages

